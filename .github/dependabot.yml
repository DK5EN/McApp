version: 2

# The GitHub default branch is `development` (it used to be `main`).
# `target-branch: development` stays set on every ecosystem below anyway: it is
# the working branch (see CLAUDE.md, "Git branches") and the branch
# scripts/release.sh cuts from, and setting it explicitly means flipping the
# default branch later cannot silently re-point these PRs to production.
#
# Since 2026-11-22 these PRs are MERGED by CI (tests.yml `automerge`, patch/minor
# after `test`; uv PRs get ble_service/uv.lock relocked first), and
# dev-release.yml cuts a dev pre-release after such merges. cooldown: a version
# must be 3 days old before it is proposed; security updates ignore it.
updates:
  # Python: the uv ecosystem understands pyproject.toml + uv.lock, which is what
  # this repo actually resolves from — `pip` would read the pyproject constraints
  # and leave uv.lock (the file that pins production) untouched.
  #
  # Directory "/" covers the whole uv workspace, root plus the ble_service
  # member. CAVEAT: ble_service ALSO ships a standalone ble_service/uv.lock used
  # for independent Pi deployment, and Dependabot will not regenerate that one —
  # `uv lock` inside the workspace resolves to the root lock. After merging a uv
  # PR, refresh it by hand: copy ble_service/{pyproject.toml,uv.lock} to a temp
  # dir OUTSIDE the workspace, `uv lock --upgrade --directory <tmp>`, copy back.
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      # Matches this repo's "[type] description" convention (CLAUDE.md).
      prefix: "[chore]"
    groups:
      # One PR for the routine churn: patch/minor bumps land together so the
      # gate runs once instead of five times. Majors stay separate — they are
      # the ones that need a real read (cryptography 49->50 and websockets
      # 16->17 both landed silently under open `>=` constraints).
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "[chore]"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"
