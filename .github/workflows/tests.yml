name: tests

# Gates every push and pull request (public repo: Actions minutes are free). Re-enabled
# 2026-11-22 for Dependabot: the `automerge` job merges Dependabot patch/minor PRs once `test`
# passed, and dev-release.yml cuts a dev pre-release after such merges. scripts/gate.sh stays the
# release gate for promotion (prod-release skill).

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint + types + startup test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # setup-uv stopped publishing moving major/minor tags at v8 (supply-chain
        # hardening) — @v10 does not exist; pin the exact release.
        #
        # v10's breaking change only affects `enable-cache: auto`, which it now
        # turns off for pull_request_target / workflow_run / release (cache
        # poisoning). The cache is enabled explicitly below and this workflow
        # triggers on none of those events, so the bump is a no-op for us.
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Pin Python 3.11
        run: uv python install 3.11

      # Ruff is PINNED. Unpinned, `uvx ruff` resolves the newest release at run
      # time, so a ruff release could turn a green branch red with no change of
      # ours — and new rules land in the `RUF`/`PL`/`S` prefixes this repo selects
      # wholesale. Commit 23b37b5 ("clear ruff 0.16 fallout") was exactly that.
      # Bump deliberately, and in lockstep with mc-chat + ble_service, which must
      # lint the shared classifier/ and contract/ subtrees under identical rules.
      - name: Ruff lint
        run: uvx ruff@0.17.3 check .

      - name: Ruff format check
        run: uvx ruff@0.17.3 format --check .

      # --all-packages is load-bearing: the root package does NOT depend on the
      # ble_service workspace member, so a plain sync leaves its deps (dbus-next,
      # …) uninstalled and mypy reports import errors across ble_service/src.
      - name: Sync workspace (all members)
        run: uv sync --all-packages

      # Must run through the project env, never uvx/pipx — mypy parses with the
      # running interpreter's grammar, and an ephemeral runner can pull a
      # different Python and emit bogus [syntax] errors on version-gated stubs.
      - name: Mypy (strict)
        run: uv run mypy src/mcapp ble_service/src

      # scripts/run_startup_tests.py is the canonical, exit-code-gated runner.
      # It is fully offline (weather is stubbed) and needs no /etc/mcapp config.
      - name: Startup test suites
        run: uv run python scripts/run_startup_tests.py

  automerge:
    name: Auto-merge Dependabot
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - id: ok
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: echo "merge=true" >> "$GITHUB_OUTPUT"

      # ble_service ships its own standalone uv.lock (used when mcapp-ble.service deploys
      # independently). Dependabot edits ble_service/pyproject.toml but never regenerates that
      # lock, and `uv lock` inside ble_service/ walks up to the workspace root. Relock it in a
      # temp dir OUTSIDE the workspace (same recipe as the prod-release skill, without
      # --upgrade: only follow the new specifiers), prove it installs, and commit it to the PR
      # branch before merging. The `test` job above does not read this lock.
      - if: steps.ok.outputs.merge == 'true' && steps.meta.outputs.package-ecosystem == 'uv'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - if: steps.ok.outputs.merge == 'true' && steps.meta.outputs.package-ecosystem == 'uv'
        uses: astral-sh/setup-uv@v10.3.2
      - name: Relock ble_service standalone
        if: steps.ok.outputs.merge == 'true' && steps.meta.outputs.package-ecosystem == 'uv'
        run: |
          tmp=$(mktemp -d)
          cp ble_service/pyproject.toml ble_service/uv.lock "$tmp"/
          uv lock --directory "$tmp"
          uv sync --directory "$tmp" --no-install-project
          if cmp -s "$tmp/uv.lock" ble_service/uv.lock; then
            echo "ble_service/uv.lock already current"
            exit 0
          fi
          cp "$tmp/uv.lock" ble_service/uv.lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ble_service/uv.lock
          git commit -q -m "[chore] Relock ble_service standalone lock"
          git push origin HEAD

      - name: Merge patch/minor
        if: steps.ok.outputs.merge == 'true'
        run: gh pr merge "$PR" --squash --delete-branch --repo "$REPO"
        env:
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
